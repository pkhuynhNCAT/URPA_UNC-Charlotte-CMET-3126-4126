<script id="cpm-engine">
const CPM = (() => {
  const W = [
    ['W1','Survey and layout',2,[],'Survey & layout'],
    ['W2','Clear and grub',3,['W1'],'Clear & grub'],
    ['W3','Temporary power service',7,['W1'],'Temporary power'],
    ['W4','Erosion control measures',4,['W2'],'Erosion control'],
    ['W5','Haul road',5,['W4'],'Haul road'],
    ['W6','Site inspection',2,['W3','W5'],'Site inspection']
  ].map(([id,name,d,p,short])=>({id,name,d,p,short}));
  const A = [
    ['A','Mobilize and site preparation',3,[],'Mobilize'],
    ['B','Excavate footings',4,['A'],'Excavate'],
    ['C','Underground utilities',6,['A'],'Utilities'],
    ['D','Form and pour footings and foundation walls',7,['B'],'Foundations'],
    ['E','Backfill and compact',3,['C','D'],'Backfill'],
    ['F','Slab on grade',4,['E'],'Slab on grade'],
    ['G','Structural steel and metal deck',8,['D'],'Steel & deck'],
    ['H','Roofing',5,['G'],'Roofing'],
    ['I','Masonry veneer',6,['F','G'],'Masonry'],
    ['J','Punch list and closeout',2,['H','I'],'Closeout']
  ].map(([id,name,d,p,short])=>({id,name,d,p,short}));
  function solve(network, overrides={}) {
    if(!Array.isArray(network)||network.length===0)throw Error('The network needs at least one activity.');
    const rows=Object.create(null),order=[];
    for(const a of network) {
      const d=overrides[a.id]??a.d;
      if(!a||typeof a.id!=='string'||!a.id||!Array.isArray(a.p)||new Set(a.p).size!==a.p.length||rows[a.id] || !Number.isInteger(d) || d<1 || d>1000) throw Error('Invalid activity or duration.');
      rows[a.id]={...a,d,p:[...a.p],s:[]};
    }
    for(const a of Object.values(rows)) for(const p of a.p){if(!rows[p]) throw Error('Unknown predecessor.'); rows[p].s.push(a.id);}
    const pending=new Set(Object.keys(rows));
    while(pending.size){
      const ready=[...pending].filter(id=>rows[id].p.every(p=>!pending.has(p)));
      if(!ready.length) throw Error('The network contains a cycle.');
      for(const id of ready){const a=rows[id]; a.ES=a.p.length?Math.max(...a.p.map(p=>rows[p].EF)):0; a.EF=a.ES+a.d; order.push(id);pending.delete(id);}
    }
    const duration=Math.max(...Object.values(rows).map(a=>a.EF));
    for(const id of [...order].reverse()){
      const a=rows[id];a.LF=a.s.length?Math.min(...a.s.map(s=>rows[s].LS)):duration;a.LS=a.LF-a.d;
      a.TF=a.LS-a.ES;a.FF=(a.s.length?Math.min(...a.s.map(s=>rows[s].ES)):duration)-a.EF;
    }
    const paths=[];
    function visit(id,path){const a=rows[id],next=[...path,id];if(!a.s.length) paths.push({ids:next,duration:next.reduce((n,k)=>n+rows[k].d,0)});else for(const s of a.s)visit(s,next);}
    for(const id of order.filter(id=>!rows[id].p.length))visit(id,[]);
    const criticalPaths=paths.filter(p=>p.duration===duration).map(p=>p.ids);
    const criticalEdges=new Set(criticalPaths.flatMap(p=>p.slice(1).map((id,i)=>p[i]+'>'+id)));
    return {rows,order,duration,paths,criticalPaths,criticalEdges};
  }
  const cells=[['E','ES'],['E','EF'],['I','ES'],['I','EF'],['J','ES'],['J','EF'],['G','LF'],['G','LS'],['D','LF'],['D','LS'],['A','LF'],['A','LS'],['C','TF'],['C','FF'],['E','TF'],['E','FF']];
  const events=[
    {id:'utilities5',activity:'C',value:11,title:'A late utility crew',from:'Maya · Utilities lead',headline:'“We need five more working days.”',body:'Underground utilities (C) will take 11 days instead of 6. Everything else keeps its original duration.',principle:'A delay within total float does not extend the project.',detail:'C uses 5 of its 6 days of total float. Its finish moves from 9 to 14, but E was already waiting for D until 14. No successor starts later; project completion stays at 30.',hint:'C has 6 days of total float at baseline. Compare the extra duration with that buffer.'},
    {id:'utilities8',activity:'C',value:14,title:'The buffer runs out',from:'Maya · Utilities lead',headline:'“This time, utilities will take 14 days.”',body:'Start again from the original plan. C takes 14 days instead of 6; all other durations are unchanged.',principle:'Only the delay beyond the available total float extends the project.',detail:'C grows by 8 days, exceeding its 6-day total float by 2. The project finishes at 32 and the controlling route moves to A → C → E → F → I → J.',hint:'Compare the 8-day increase with C’s original 6 days of total float. How much is left over?'},
    {id:'steel4',activity:'G',value:12,title:'Steel hits a snag',from:'Alex · Steel lead',headline:'“Fabrication adds four working days.”',body:'Return to the original plan. Structural steel and metal deck (G) takes 12 days instead of 8.',principle:'A longer activity on a critical path extends this project day for day.',detail:'G originally has zero total float. Its 4-day increase moves project completion from 30 to 34. The route A → B → D → G → I → J still controls completion.',hint:'Find G’s total float in the original plan. Is there any buffer to absorb the 4-day increase?'},
    {id:'steelshort',activity:'G',value:5,title:'The one-day surprise',from:'Jordan · Project lead',headline:'“Can faster steel recover three days?”',body:'Return to the original plan. The team proposes shortening G from 8 to 5 days. Predict how early the whole station can finish.',principle:'Shortening one critical activity helps only until another path controls completion.',detail:'The first day gained on G brings the steel route down to 29, tying the route through E and F. Shortening G further leaves that other route at 29. The full three-day cut saves just one project day.',hint:'The route A → B → D → E → F → I → J takes 29 days at baseline. Shortening G does not shorten that route.'}
  ];
  return {W,A,solve,cells,events};
})();

const TERMS=[
['Activity','One clearly defined job, such as excavating footings. In an activity-on-node network, a box represents the job.'],
['Predecessor & successor','A predecessor is a job directly before another job. A successor is directly after it. Arrows tell you which job must finish before the next can start.'],
['Path','One continuous route through the arrows from project start to project finish. Add the durations on that route. Parallel routes are not added together.'],
['Critical path','The longest complete path determines the earliest project completion. More than one route can tie for longest. In these unconstrained networks, critical activities have zero total float.'],
['ES · Early start','The earliest time a job can start. At a merge, use the largest early finish among all immediate predecessors. A first activity starts at 0.'],
['EF · Early finish','The earliest time a job can finish: EF = ES + duration. There is no extra +1.'],
['LF · Late finish','The latest allowable finish that preserves the calculated project completion. At a branch, use the smallest late start among immediate successors.'],
['LS · Late start','The latest allowable start: LS = LF − duration. “Late” is a permissible limit here; it does not mean the job is behind schedule.'],
['TF · Total float','Delay available from an activity’s early dates before project completion moves. TF = LS − ES = LF − EF. It can be shared by activities on the same route.'],
['FF · Free float','Delay available before any immediate successor’s early start moves. FF = minimum successor ES − the activity’s EF. Free float can be smaller than total float.'],
['Terminal activity','An activity with no successors. Use the project finish for its late finish. For free float, subtract its EF from project finish. W6 and J each finish their project, so their free float is 0.'],
['Driving relationship','At a forward merge, the predecessor finishing last currently controls the next start. A relationship may drive a successor even when its route is not the longest route through the whole project.'],
['Near-critical route','A route only a little shorter than the longest one. It deserves attention: a small delay, or shortening the original critical route, can put it in control.'],
['Working-day boundary','Time 0 is the end of day 0, the beginning of day 1. A three-day activity with ES 0 finishes at EF 3. Its work occupies days 1, 2, and 3.'],
['Planning & scheduling','Planning works out what will be built, how, and by whom. Scheduling works out the timing and sequence in detail. Correct CPM arithmetic still needs realistic activity logic and durations.'],
['Duration estimate','A prediction of how much working time a job needs. Quantity divided by an appropriate production rate can help. Estimates also need project-specific evidence and review by the people doing the work.']
];

W,WARM)+'</section>':'')+(state.calc.reviewed?'<section><h2>Completed fire-station schedule</h2>'+allRows(CPM.A,BASE)+'</section>':'')+(Object.keys(state.practice||{}).length?'<section><h2>Apply the ideas: optional new examples</h2>'+Object.entries(state.practice).map(([i,a])=>'<p>'+esc(PRACTICE[i].title)+': '+esc(PRACTICE[i].choices[a.choice])+'. '+a.attempts+' attempt(s). Latest response '+(a.choice===PRACTICE[i].right?'matches':'does not match')+' the worked reasoning.<br>'+esc(PRACTICE[i].why)+'</p>').join('')+'</section>':'')+'<footer><p class="small">App version 4.1. Course concept and networks: Chau “Charlie” Le, UNC Charlotte, September 10, 2026. Time 0 is the end of day 0. All relationships are finish-to-start with zero lag.</p></footer></body></html>';

  else if(action==='reflection-done'){if(!state.calc.reflectionSaved)return;const first=!state.calc.reviewed;state.calc.reviewed=true;save();go('events');if(first){celebrate();toast('Round 2 complete. You built a 30-day schedule.');}}

  if(kind==='warm'){const n=Number(data.get('days'));if(!Number.isInteger(n)||n<1||n>1000)return;transient.warmDays=String(n);const ids=warmPath(),valid=WARM.paths.some(p=>p.ids.join(',')===ids.join(','));if(!valid){setMessage('Trace one connected route','Start at W1, finish at W6, and follow arrows without jumping between branches. Then lock your prediction.','warn');return;}state.w.prediction=n;advance();}

rking. The jobs overlap, so do not add 4 and 9.':phase===1?'A finish at 15 would miss the first crew’s required start at 12. Choose the earlier requirement.':'The project has room, but the immediate next crew has no room. The two float values protect different things.'}</div>`:''}${lessonAnswer===correct?coachBtn('phase-done','Try one number in the class plan'):smallHelp(phase===0?'Wait for the later incoming finish.':phase===1?'Protect both next jobs. Which time comes first?':'Which promise has zero room? That is the first promise affected.')}</section>`;}

  pauseForDialog();const h=currentHelp();
  modal('Help with this step',`${coaching(h.title,h.text)}<div class="help-next"><strong>Your next action</strong><p>${h.next}</p></div><button class="btn accent" data-action="close-modal">Return to my step ${I('arrow')}</button><details class="tiny-help"><summary>How do I use the simulation?</summary><dl class="plain-definitions"><div><dt>Play / Pause</dt><dd>Watch crews work, or stop to think. Nothing is timed or graded.</dd></div><div><dt>+1 day</dt><dd>Move forward one working day. You can use this for the entire demonstration.</dd></div><div><dt>Replay</dt><dd>Return to the start of this demonstration. Your class answers stay saved.</dd></div><div><dt>Next handoff</dt><dd>Jump to the next job finish anywhere in the full plan. All ten activity tracks are shown, through final closeout.</dd></div><div><dt>Time slider</dt><dd>Drag to a time, or focus it and use the arrow keys. The worker positions and captions update together.</dd></div><div><dt>Waiting / Working / Finished</dt><dd>The words show the crew’s state. You do not have to rely on the track colors.</dd></div></dl><p>Prefer less movement? Turn on <strong>Text size → Reduce motion</strong>. Play then advances one day per press.</p></details><details class="tiny-help"><summary>What do the scheduling words mean?</summary><dl class="plain-definitions"><div><dt>Activity and duration</dt><dd>A job, and how many working days it takes.</dd></div><div><dt>Predecessor and successor</dt><dd>A job immediately before this job, and a job immediately after it.</dd></div><div><dt>Early start / early finish (ES / EF)</dt><dd>The earliest a job can start or finish after respecting the arrows.</dd></div><div><dt>Late start / late finish (LS / LF)</dt><dd>The latest a job can start or finish while keeping the calculated project finish.</dd></div><div><dt>Total float (TF)</dt><dd>How far a job can be delayed without making the project finish later, with the rest of this plan unchanged.</dd></div><div><dt>Free float (FF)</dt><dd>How far a job can be delayed without moving the early start of an immediate next job.</dd></div><div><dt>Critical path</dt><dd>A complete route that takes as long as the whole project. Several routes can tie.</dd></div></dl></details><details class="tiny-help"><summary>How do I save, leave, or start over?</summary><p>Progress saves in this browser after each step when saving is available. Use <strong>My progress → My notebook → Export progress backup</strong> before changing browsers or devices.</p><p>To repeat only the first nine steps, use the button below. Your class calculations and completed missions stay saved. Your practice answers from the first nine steps will be replaced as you replay them.</p>${coachBtn('restart-tour','Walk through the first example',true)}<p>To clear the entire journey, use <strong>Text size → Start a fresh journey</strong>. That action asks you to confirm.</p></details><p class="small muted">Pip is a built-in guide with prepared explanations. No account, internet connection, or AI service is needed.</p>`);
}
function predictionReview(guess,actual,unit='days'){
  return `<div class="prediction-review"><div><span>Your prediction</span><strong>${guess} <small>${unit}</small></strong></div><span class="prediction-arrow" aria-hidden="true">→</span><div><span>What happened</span><strong>${actual} <small>${unit}</small></strong></div><p>${guess===actual?'Your prediction matched. Now use the crew handoff to explain why.':'Your prediction helped you test an idea. Compare the crew handoff with what you expected.'}</p></div>`;
}
// Setting changes retain the current simulation and update its controls immediately.
document.addEventListener('change',ev=>{if(ev.target.id==='setting-motion'){if(movie&&state.settings.reduced){movie.playing=false;cancelAnimationFrame(movieFrame);}paintMovie(true);}if(ev.target.matches('[data-movie-slider]'))save();});
window.addEventListener('pagehide',()=>save());
// Opening the journey is a save checkpoint, even when storage was blocked before.
document.addEventListener('click',ev=>{if(ev.target.closest('[data-action="export-backup"]'))save();},true);

function passDirection(backward=false){return `<div class="pass-direction ${backward?'backward':''}"><span aria-hidden="true">${backward?'⟵':'⟶'}</span><div><strong>${backward?'Backward pass':'Forward pass'}</strong><small>${backward?'Calculate toward the start. Work-order arrows still point right.':'Calculate toward the finish. Follow the work-order arrows.'}</small></div></div>`;}

function flowDiagram(nodes,edges,{backward=false,pass=false,label='Work order'}={}){
  const branched=nodes.length>2,h=branched?416:212,boxH=192,positions={};
  nodes.forEach(n=>positions[n.id]={x:n.side==='right'?640:0,y:branched?(n.row===0?0:n.row===1?224:112):10});
  const key='flow-'+nodes.map(n=>n.id.replace(/[^a-z0-9]/gi,'')).join('-');
  return `<figure class="flow-figure" aria-label="${esc(label)}"><figcaption><span class="flow-key">Work order →</span> Arrows mean “finish before the next job starts.”</figcaption><div class="flow-scroll" tabindex="0" role="region" aria-label="Work-order diagram. Scroll sideways if enlarged."><div class="flow-diagram" style="height:${h/16}rem"><svg class="flow-wires" viewBox="0 0 1000 ${h}" preserveAspectRatio="none" aria-hidden="true"><defs><marker id="${key}" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="22" markerHeight="14" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#346b59"/></marker></defs>${edges.map(([a,b])=>{const p=positions[a],q=positions[b],incoming=edges.filter(e=>e[1]===b),slot=incoming.findIndex(e=>e[0]===a)-(incoming.length-1)/2,y=p.y+boxH/2,v=q.y+boxH/2+slot*28;return `<path data-dependency="${a}>${b}" data-start="${p.x+360},${y}" data-end="${q.x},${v}" d="M${p.x+360} ${y} C500 ${y} 500 ${v} ${q.x} ${v}" fill="none" stroke="#346b59" stroke-width="2.5" vector-effect="non-scaling-stroke" marker-end="url(#${key})"/>`;}).join('')}</svg>${nodes.map(n=>`<div class="flow-node ${n.target?'target':''}" data-flow-node="${n.id}" style="left:${positions[n.id].x/10}%;top:${positions[n.id].y/16}rem;height:${boxH/16}rem"><strong>${esc(n.title)}</strong>${n.value!==undefined?`<b>${esc(n.value)}</b>`:''}<small>${esc(n.note||'')}</small></div>`).join('')}</div></div>${pass?passDirection(backward):''}<p class="flow-text">${edges.map(([a,b])=>`${esc(nodes.find(n=>n.id===a).title)} → ${esc(nodes.find(n=>n.id===b).title)}`).join('; ')}.</p></figure>`;
}

function networkGeometry(warm=false){return warm?{w:174,h:126,width:1062,height:476,pos:{W1:[20,172],W2:[232,40],W4:[444,40],W5:[656,40],W3:[444,310],W6:[868,172]}}:{w:174,h:126,width:1486,height:478,pos:{A:[20,174],B:[232,40],C:[444,312],D:[444,40],G:[656,40],E:[656,312],H:[868,40],F:[868,312],I:[1080,312],J:[1292,174]}};}

function dependencyPath(from,to,geo){const [x,y]=geo.pos[from],a=x+geo.w,b=y+geo.h/2,[c,d]=dependencyEnd(from,to,geo);if(from==='G'&&to==='I')return `M${a} ${b} H849 V236 H1060 V${d} H${c}`;const mid=(a+c)/2;return `M${a} ${b} C${mid} ${b} ${mid} ${d} ${c} ${d}`;}

function traceNetwork(){const selected=state.w.path,last=selected.at(-1),complete=last==='W6',allowed=last?WARM.rows[last].s:['W1'],geo=networkGeometry(true);return `<div class="trace-scroll" tabindex="0" role="region" aria-label="Six-job network. Scroll sideways to follow work from left to right."><div class="trace-network" style="width:${geo.width/16}rem;height:${geo.height/16}rem"><svg viewBox="0 0 ${geo.width} ${geo.height}" aria-hidden="true"><defs><marker id="trace-tip" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#346b59"/></marker></defs>${CPM.W.flatMap(a=>a.p.map(p=>`<path data-dependency="${p}>${a.id}" data-start="${geo.pos[p][0]+geo.w},${geo.pos[p][1]+geo.h/2}" data-end="${dependencyEnd(p,a.id,geo).join(',')}" d="${dependencyPath(p,a.id,geo)}" fill="none" stroke="#346b59" stroke-width="2.5" marker-end="url(#trace-tip)"/>`)).join('')}</svg>${CPM.W.map(a=>{const r=WARM.rows[a.id],on=selected.includes(a.id),can=allowed.includes(a.id)&&!complete,[x,y]=geo.pos[a.id];return `<button class="trace-job ${on?'visited':''} ${can?'available':''}" data-coach="trace" data-id="${a.id}" style="left:${x/16}rem;top:${y/16}rem;width:${geo.w/16}rem;height:${geo.h/16}rem" ${!can?'disabled':''}><span class="trace-number">${on?'✓ ':''}${a.id}</span><strong>${esc(r.short)}</strong><span>${r.d} days</span></button>`;}).join('')}</div></div><p class="small muted">Follow the solid arrows from left to right. Parallel branches are stacked. On a small screen, swipe sideways; the next available job stays in view.</p>`;}

function practiceNetwork(phase){return phase===0?flowDiagram([{id:'crew-a',title:'Crew A',value:'4',note:'Early finish',side:'left',row:0},{id:'crew-b',title:'Crew B',value:'9',note:'Early finish',side:'left',row:1},{id:'next',title:'Next crew',value:'?',note:'Early start · needs both',side:'right',target:true}],[['crew-a','next'],['crew-b','next']],{pass:true,label:'Two parallel crews lead to one next job.'}):flowDiagram([{id:'this',title:'This job',value:'?',note:'Latest finish',side:'left',target:true},{id:'next-a',title:'Next crew A',value:'12',note:'Latest start',side:'right',row:0},{id:'next-b',title:'Next crew B',value:'15',note:'Latest start',side:'right',row:1}],[['this','next-a'],['this','next-b']],{pass:true,backward:true,label:'One job branches to two successor crews.'});}

function eventStageLimit(i=state.eventIndex){const r=state.events[i];return r.prediction===null?1:r.pathDone?4:state.coach.watched[i]?3:2;}

function eventStage(i=state.eventIndex){const r=state.events[i],limit=eventStageLimit(i);return Math.max(1,Math.min(limit,r.view||limit));}

function setEventStage(stage){const i=state.eventIndex;stopMovie();state.events[i].view=Math.max(1,Math.min(eventStageLimit(i),stage));transient.message=null;transient.tutor=null;save();render(true);}

function reportNavigation(stage){const i=state.eventIndex,limit=eventStageLimit(i);return eventNav()+`<nav class="four-beats" aria-label="Report learning steps">${['Guess','Watch','Find the route','Explain'].map((label,n)=>`<button data-coach="event-stage" data-stage="${n+1}" class="${stage===n+1?'current':n+1<=limit?'done':''}" ${n+1>limit?'disabled':''} ${stage===n+1?'aria-current="step"':''}>${n+1} · ${label}</button>`).join('')}</nav><div class="report-back-row">${stage>1?`<button class="btn text small" data-coach="event-back">← Back to ${['Guess','Watch','Find the route'][stage-2]}</button>`:i>0?'<button class="btn text small" data-coach="previous-report">← Previous report</button>':'<span class="small muted">Start with a guess. We will guide each step.</span>'}${limit>stage?`<button class="btn secondary small" data-coach="event-stage" data-stage="${stage+1}">Continue to ${['','Watch','Find the route','Explain'][stage]} →</button>`:''}</div>`;}

function rememberMovie(){if(!movie)return;const c=state.coach;c.movieTimes=c.movieTimes||{};c.movieTimes[movie.kind]=Math.max(movie.start,Math.min(movie.end,Number(movie.time.toFixed(3))));}

function dependencyEnd(from,to,geo){const net=geo.pos.W1?CPM.W:CPM.A,parents=[...net.find(a=>a.id===to).p].sort((a,b)=>geo.pos[a][1]-geo.pos[b][1]),slot=parents.indexOf(from)-(parents.length-1)/2;return [geo.pos[to][0],geo.pos[to][1]+geo.h/2+slot*34];}

function applyReadingSize(){const size=[100,125,150,200].includes(state.settings.textSize)?state.settings.textSize:100;document.documentElement.style.fontSize=size+'%';document.documentElement.style.setProperty('--reading-scale',String(size/100));document.documentElement.dataset.readingSize=String(size);}

function fieldIllustration(svg){return svg.replace(/<circle cx="400"[^>]*\/>\s*<circle cx="583"[^>]*\/>\s*<circle cx="583"[^>]*\/>/,'').replace(/<g class="cloud-drift"[\s\S]*?<\/g>/,'').replace(/<g class="site-spark"[\s\S]*?<\/g>/,'').replace(/<g transform="translate\(548 358\)">[\s\S]*?<\/g>/,`<g transform="translate(548 358)" aria-hidden="true"><path d="M0 0v45" stroke="#587454" stroke-width="5"/><rect x="-31" y="-23" width="65" height="41" rx="3" fill="#fff8e6" stroke="#587454" stroke-width="2"/><path d="M-18 5v-17h36V5M-10 5V-6h7V5m6 0V-6h7V5" fill="none" stroke="#a14b30" stroke-width="3"/></g>`).replaceAll('fill="url(#art-ground)"','fill="#d0dcc1"').replaceAll('fill="url(#art-roof)"','fill="#355c49"').replaceAll('fill="#dcebd2"','fill="#e9eee0"');}

function networkReading(net,sol,known){return `<div class="network-reading" hidden><ol>${net.map(a=>{const r=sol.rows[a.id];return `<li><strong>${esc(a.id)} · ${esc(a.short)}</strong><p>${r.d} working days. ${a.p.length?'Waits for '+a.p.map(esc).join(' and ')+'.':'No earlier job is required.'}</p><p>${r.s.length?'Next: '+r.s.map(esc).join(' and ')+'.':'Final activity.'}</p><dl>${['ES','EF','LS','LF','TF','FF'].filter(f=>known(a.id,f)).map(f=>`<div><dt>${LONG[f]}</dt><dd>${r[f]}</dd></div>`).join('')}</dl></li>`;}).join('')}</ol></div>`;}

render();
</script>
</body></html>
